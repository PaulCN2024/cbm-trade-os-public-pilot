name: Supabase 保活 + 健康告警

# 每 3 天 ping 一次云端只读口 /api/inbound?action=export：
#  ① 触发一次 leads 查询 → 给 Supabase 免费库制造活动，防它 7 天不活动被自动暂停（本次故障根因）。
#  ② 兼做健康检查：连不上/库挂 → 本 job 失败 → GitHub 自动邮件通知仓库 owner（Paul）。
on:
  schedule:
    - cron: '0 8 */3 * *'   # 每 3 天 08:00 UTC 触发
  workflow_dispatch: {}       # 支持手动触发（Actions 页点 Run）

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping keepalive endpoint (保活 + 健康·无需密钥)
        run: |
          resp=$(curl -sS -m 30 -w $'\n%{http_code}' "https://project-7vo99.vercel.app/api/inbound?action=ping")
          code=$(echo "$resp" | tail -n1)
          body=$(echo "$resp" | sed '$d')
          echo "HTTP $code · $body"
          echo "$body" | grep -q '"healthy":true' || { echo "::error::云库不健康——可能被暂停或连接失败，请检查 Supabase 项目状态"; exit 1; }
          echo "OK 云库健康·已保活"
